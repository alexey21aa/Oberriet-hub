name: Restore preserved source and Git history
on:
  push:
    branches: [main]
    paths: ['.github/workflows/restore-checkpoint.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: oberriet-history-import
  cancel-in-progress: false
jobs:
  restore:
    if: github.repository == 'alexey21aa/Oberriet-hub' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
      - name: Verify archive and merge preserved history
        shell: bash
        run: |
          set -euo pipefail
          git bundle verify oberriet-hub.git.bundle
          git fetch ./oberriet-hub.git.bundle refs/heads/main:refs/remotes/preserved/main
          preserved=$(git rev-parse refs/remotes/preserved/main)
          test "$preserved" = "37114bdc8a25dfc3ce03b1b3398537905553f6fa"
          python3 - <<'PY'
          import zipfile, subprocess
          z = zipfile.ZipFile('Oberriet_Hub_Source.zip')
          assert z.comment.decode().strip() == '37114bdc8a25dfc3ce03b1b3398537905553f6fa'
          for name in z.namelist():
              if not name.endswith('/'):
                  expected = subprocess.check_output(['git', 'show', 'refs/remotes/preserved/main:' + name])
                  assert expected == z.read(name), name
          PY
          git config user.name 'Oberriet Hub import'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          if ! git merge-base --is-ancestor "$preserved" HEAD; then
            git merge --allow-unrelated-histories refs/remotes/preserved/main -m 'Restore original source files and complete preserved Git history'
          fi
          git merge-base --is-ancestor "$preserved" HEAD
          test -f wp-content/plugins/oberhub-core/oberhub-core.php
          test -f wp-content/themes/oberhub-theme/style.css
          test -f data/seed.json
          git push origin HEAD:main
          echo "Imported native source history through $preserved; production unchanged." >> "$GITHUB_STEP_SUMMARY"
